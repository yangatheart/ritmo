<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c100b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Ritmo plans your coffee into the gaps between calls, so it is hot when you are free.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ritmo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a premium coffee product: warm, unhurried, exact
   IDEA: a café's pass: one cup under a light, timed to the second
   PICTURE: espresso card with a live cup and a ring for brew progress or temperature
   COLOUR and TYPE: roast brown and warm white, crema tones, tomato accent; Sora numerals + Inter
   LAYOUT: one column, max 480px, sticky tab bar, safe-area padding */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#110a07);--bg2:light-dark(#f5f0eb,#1d130e);--ink:light-dark(#1f1510,#f4ece4);--mut:light-dark(#7d6d62,#a89587);
--line:light-dark(#ebe3db,#2e221b);--roast:#1c100b;--roast2:#2e1b12;--crema:#d9a66a;--foam:#f6ede3;
--acc:#e04a2f;--ok:light-dark(#11795c,#3cbf93);--okl:#5fd3a8;--warn:#e3a04a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--roast);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Sora,Inter,sans-serif;margin:0;line-height:1.1;text-wrap:balance;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;min-height:44px;padding:0 16px;background:none}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid #ff9c84;outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 18px 4px;position:sticky;top:0;background:var(--bg);z-index:3}
.logo{padding:0;min-height:40px;font:600 20px Sora,sans-serif;display:flex;gap:9px;align-items:center;letter-spacing:-.01em}
.logo svg{width:28px;height:28px}
.sync{font-size:13px;color:var(--mut);padding:0 2px;min-height:40px}
.view{flex:1;padding:6px 18px 28px;animation:fade .25s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.nav{display:flex;border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom);z-index:3}
.nav button{flex:1;color:var(--mut);border-radius:0;min-height:60px;font-size:12px;font-weight:600;display:grid;place-items:center;padding:6px 0}
.nav svg{width:22px;height:22px}.nav button[aria-current=true]{color:var(--ink)}.nav button[aria-current=true] svg{color:var(--acc)}
.hd{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px;gap:10px}
.hd h2{font-size:30px}.hd small{display:block;color:var(--mut);font-size:14px;margin-top:4px}
.chip{font-size:13px;font-weight:600;padding:0 12px;min-height:34px;border-radius:99px;background:var(--bg2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.chip.off .dot{background:var(--warn)}.chip.demo{background:var(--acc);color:#fff}
/* hero */
.hero{position:relative;border-radius:28px;padding:18px 18px 20px;margin-bottom:22px;color:var(--foam);overflow:hidden;
  background:radial-gradient(120% 90% at 20% 0%,#4a2c1c 0%,var(--roast2) 45%,var(--roast) 100%);box-shadow:0 18px 40px -18px #1c100b99}
.hero .grid{display:grid;grid-template-columns:138px minmax(0,1fr);gap:14px;align-items:center}
@media(max-width:350px){.hero .grid{grid-template-columns:minmax(0,1fr)}.hero .cup{justify-self:center}}
.hero .cup svg{width:138px;height:138px;display:block}
.hero .k{font-size:14px;color:#d8c2b0}.hero .k b{color:var(--crema);font-weight:600}
.hero h3{font:600 clamp(40px,12vw,52px)/1 Sora,sans-serif;margin:6px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero h3 small{font-size:16px;font-weight:400;color:#d8c2b0;margin-left:6px;letter-spacing:0}
.hero p{margin:0;font-size:15px;color:#eadbcd}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero .why{margin-top:14px;padding-top:12px;border-top:1px solid #ffffff1c;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;padding:4px 10px;border-radius:99px;background:#ffffff14;color:#f0e2d4;white-space:nowrap}
.tag.bad{background:#e04a2f33;color:#ffc2b5}.tag.good{background:#3cbf9326;color:#b8f0da}
.btn{background:var(--foam);color:var(--roast);font-weight:600}
.btn2{box-shadow:inset 0 0 0 1.5px #ffffff55;color:var(--foam);font-weight:600}
.btn.red{background:var(--acc);color:#fff}
.b1{background:var(--ink);color:var(--bg);font-weight:600}
.b2{box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600}
.big{width:100%;background:var(--acc);color:#fff;font-weight:600;font-size:17px;min-height:56px;border-radius:18px}
.ghost{width:100%;background:var(--bg2);font-weight:600}
/* timeline */
.sec{font-size:18px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}.sec span{font:400 13px Inter;color:var(--mut)}
.tl{list-style:none;margin:0 0 0 6px;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:52px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl>li{display:grid;grid-template-columns:46px 16px minmax(0,1fr);gap:8px;align-items:start;padding:7px 0;position:relative}
.tl time{font:600 14px Sora,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:9px}
.tl .pin{width:12px;height:12px;border-radius:50%;margin:12px 0 0 1px;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line);z-index:1}
.tl .busy{background:var(--bg2);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--mut)}
.tl li.now .pin{background:var(--acc);box-shadow:0 0 0 4px #e04a2f33}
.tl li.past{opacity:.5}
.tl .cof{border-radius:14px;padding:8px 12px;box-shadow:inset 0 0 0 1.5px var(--line);display:block;width:100%;text-align:left;min-height:0}
.tl .cof.on{background:linear-gradient(135deg,#2e1b12,#4a2c1c);color:var(--foam);box-shadow:none}
.tl .cof b{font-size:15px;font-weight:600}.tl .cof small{display:block;font-size:13px;opacity:.75}
.tl li.c .pin{background:var(--crema);box-shadow:none}.tl li.c.offc .pin{background:var(--bg);box-shadow:inset 0 0 0 2px var(--crema)}
.st{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:#ffffff1f;margin-left:6px;white-space:nowrap}
.cof:not(.on) .st{background:var(--bg2)}
.edit{grid-column:3;background:var(--bg2);border-radius:14px;padding:12px;margin-top:-2px}
.edit .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.edit+.edit{margin-top:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 12px;border-radius:99px;background:var(--bg);font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:20px 0 14px}
.stats div{background:var(--bg2);border-radius:16px;padding:12px 10px}.stats b{font:600 24px/1 Sora,sans-serif;display:block}.stats span{font-size:12px;color:var(--mut);line-height:1.25;display:block;margin-top:6px}
/* cards & settings */
.card{background:var(--bg2);border-radius:20px;padding:16px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:6px}.card p{margin:0;font-size:14px;color:var(--mut)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0;padding-bottom:2px}.set:first-child{padding-top:2px}.set b{display:block;font-size:15px;font-weight:600}.set span{font-size:13px;color:var(--mut)}
.set.col{flex-direction:column;align-items:stretch}
.step{display:flex;align-items:center;gap:4px;flex:none}.step button{min-width:42px;padding:0;background:var(--bg);font-size:20px}
.step output{min-width:58px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.sw{width:52px;min-height:32px;height:32px;padding:0;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px #0003}
.sw[aria-pressed=true]{background:var(--ok)}.sw[aria-pressed=true]::after{left:23px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:8px}
.week button{min-height:52px;padding:0;border-radius:12px;background:var(--bg);font-size:13px;font-weight:600;display:grid;place-items:center;line-height:1.1}
.week button small{font-size:11px;font-weight:500;color:var(--mut)}.week button.home{background:var(--ink);color:var(--bg)}.week button.home small{color:inherit;opacity:.7}
.lvl{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}.bar i.lo{background:var(--acc)}
.mstage{border-radius:28px;padding:16px;margin-bottom:14px;color:var(--foam);background:radial-gradient(100% 80% at 50% 0%,#4a2c1c,var(--roast))}
.mstage .top{display:flex;justify-content:space-between;align-items:center}.mstage svg{display:block;margin:4px auto 0;width:200px;height:200px}
.mstage .seg button{background:#ffffff14;box-shadow:none;color:var(--foam)}.mstage .seg button[aria-pressed=true]{background:var(--foam);color:var(--roast)}
.err{font-size:14px;background:light-dark(#fde8e3,#3a1a12);color:light-dark(#8f2414,#ffb4a3);padding:10px 12px;border-radius:12px;margin:8px 0}
.priv{font-size:13px;color:var(--mut);margin:12px 2px}
.busyed{list-style:none;padding:0;margin:0 0 8px}.busyed li{display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.busyed button{color:var(--acc);font-weight:600;padding:0 6px}
.addb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.addb label{font-size:13px;color:var(--mut)}.addb input{width:100%;min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:0 8px;background:var(--bg)}
.file{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;background:var(--bg);font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line)}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.log{list-style:none;margin:0;padding:0;font-size:14px}.log li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.log time{font-weight:600;color:var(--acc);flex:none;font-variant-numeric:tabular-nums}
/* banner */
.banner{position:fixed;left:50%;width:min(456px,calc(100% - 24px));top:calc(env(safe-area-inset-top) + 8px);background:var(--roast);color:var(--foam);border-radius:20px;padding:12px 14px;font-size:15px;box-shadow:0 16px 40px #0007;transform:translate(-50%,-160%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:9}
.banner:not(.show){visibility:hidden;transition:transform .35s,visibility 0s .35s}.banner.show{transform:translate(-50%,0)}
.banner b{display:block;font-size:12px;color:var(--crema);margin-bottom:2px;font-weight:600}
.banner .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.banner button{min-height:38px;background:#ffffff1f;font-weight:600;font-size:14px}.banner button:first-child{background:var(--foam);color:var(--roast)}
/* onboarding */
.onb{position:fixed;inset:0;z-index:8;overflow-y:auto;background:radial-gradient(120% 70% at 50% 0%,#4a2c1c,var(--roast) 70%);color:var(--foam)}
.onb>div{max-width:480px;margin:auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column}
.onb h2{font-size:34px;margin:8px 0 10px}.onb p{color:#dcc8b7;margin:0 0 16px}
.onb .dots{display:flex;gap:6px;margin-bottom:12px}.onb .dots i{width:22px;height:4px;border-radius:4px;background:#ffffff2a}.onb .dots i.on{background:var(--crema)}
.onb .card{background:#ffffff10;color:var(--foam)}.onb .card p,.onb .set span{color:#cdb7a5}.onb .set{border-color:#ffffff18}
.onb .step button,.onb .week button,.onb .seg button,.onb .file,.onb .addb input{background:#ffffff14;color:var(--foam);box-shadow:none;border-color:#ffffff22}
.onb .week button.home,.onb .seg button[aria-pressed=true]{background:var(--foam);color:var(--roast)}
.onb .pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#ffffff10;border-radius:18px;padding:14px 16px;margin-bottom:10px;min-height:64px}
.onb .pick b{display:block;font-size:16px}.onb .pick small{color:#cdb7a5;font-size:13px}.onb .pick svg{flex:none;width:28px;height:28px;color:var(--crema)}
.onb .priv{color:#bfa898}.onb .busyed li{border-color:#ffffff18}
.onb .foot{margin-top:auto;padding-top:18px;display:grid;gap:8px}
.onb .ghost{background:#ffffff12;color:var(--foam)}
.onb .heroimg{display:flex;justify-content:center;margin:12px 0 4px}.onb .heroimg svg{width:min(260px,70vw);height:auto}
/* demo */
.demo{background:var(--roast);color:var(--foam);padding:10px 18px;display:grid;gap:8px;position:sticky;top:54px;z-index:2}
.demo .row{display:flex;gap:6px;flex-wrap:wrap}.demo .row button{background:#ffffff14;font-size:13px;font-weight:600;min-height:38px;padding:0 11px}
.demo .row button[aria-pressed=true]{background:var(--foam);color:var(--roast)}.demo .go{background:var(--acc)!important;color:#fff}
.demo output{font:600 28px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;margin-right:auto}
.demo .top{display:flex;align-items:center;gap:8px}.demo summary{cursor:pointer;font-size:14px;color:#d8c4b4;min-height:32px;display:flex;align-items:center}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.steam path{animation:rise 2.6s infinite ease-out}.steam path:nth-child(2){animation-delay:.8s}.steam path:nth-child(3){animation-delay:1.6s}
@keyframes pour{to{stroke-dashoffset:-24}}.pour{animation:pour .6s linear infinite}
@keyframes glow{50%{opacity:.55}}.glow{animation:glow 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="sbar">
    <button class="logo" id="logo" aria-label="Ritmo"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#e04a2f"/><path d="M19 27h24v9a10 10 0 0 1-10 10h-4a10 10 0 0 1-10-10z" fill="#fff"/><path d="M43 30h3a4 4 0 0 1 0 8h-3" stroke="#fff" stroke-width="3" fill="none"/><path d="M27 18c-2 3 2 4 0 7M35 18c-2 3 2 4 0 7" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>Ritmo</button>
    <button class="sync" id="sync" data-a="syncbar"></button>
  </header>
  <div id="demo"></div>
  <main class="view" id="view"></main>
  <nav class="nav" id="nav"></nav>
</div>
<div class="banner" id="ban" role="status" aria-live="polite"></div>
<div id="onb"></div>

<script>
{
/* ================= constants & helpers ================= */
const KEY='ritmo.app.v2',STEP=15,HEAT=60,H=3600,M=60;
const DR={ristretto:{n:'Ristretto',brew:20,water:5,tau:11,fill:.3},espresso:{n:'Espresso',brew:30,water:7,tau:14,fill:.45},lungo:{n:'Lungo',brew:50,water:12,tau:18,fill:.65},americano:{n:'Americano',brew:90,water:24,tau:26,fill:.85}};
const PEND=['planned','checked','alert'],LIVE=['heating','brewing','ready','held'],DONE=['collected','cold','skipped','passed'];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>{const m=Math.floor(s/60);return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
const dur=s=>{const m=Math.round(s/60);return m>=60?Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':''):m+' min'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const nowSec=()=>{const d=new Date();return d.getHours()*H+d.getMinutes()*M+d.getSeconds()};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],TYPES={home:'Home day',office:'Office day',off:'Day off'};
const SAMPLE=[[9,9.5],[9.5,10.5],[10+40/60,11.5],[11.5,12],[13,14],[14,14.75],[15,16]].map(([s,e])=>({s:Math.round(s*H),e:Math.round(e*H)}));
const SRV={google:{server:'Google Calendar',tool:'list_events',name:'Google Calendar'},outlook:{server:'Microsoft 365',tool:'outlook_calendar_search',name:'Outlook'}};
const inClaude=typeof window.claude!=='undefined';
const ICON={today:'<path d="M4 6h16v14H4zM4 10h16M8 3v5M16 3v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  machine:'<path d="M6 3h12v18H6zM9 7h6M9 13h6v5H9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  routine:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'};

/* ================= state ================= */
const baseSet=()=>({max:3,start:8.5*H,cutoff:15*H,end:18*H,spacing:90,walk:2,drink:'espresso',auto:true,heads:true,notif:false,week:['off','home','home','home','home','home','off']});
const baseMach=()=>({water:70,bin:4,binMax:10,descale:38,pod:true,cup:true,state:'standby'});
const dayState=()=>({date:dayKey(new Date()),type:null,plan:[],log:[],k:{onTime:0,cold:0,held:0,saved:0},over:null,paused:false,seq:0,open:null,forget:false,manual:[]});
const fresh=()=>Object.assign({onb:0,src:null,set:baseSet(),m:baseMach(),busy:[],busyDate:null,ics:null,sync:{},t:nowSec(),tab:'today',demo:false},dayState());
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.set&&r.set.week)return Object.assign(fresh(),r,{demo:false})}catch(e){}return null}
function save(){if(S.demo)return;try{localStorage.setItem(KEY,JSON.stringify(Object.assign({},REAL,{confirmReset:false,open:null})))}catch(e){}}
let REAL=load()||fresh(),S=REAL,mcp=null,banT,syncing=false;

/* ================= calendar → busy blocks ================= */
function merge(list){const o=list.filter(b=>b.e>b.s).sort((a,b)=>a.s-b.s),m=[];for(const b of o){const l=m[m.length-1];if(l&&b.s<=l.e)l.e=Math.max(l.e,b.e);else m.push({s:b.s,e:b.e})}return m}
function busyNow(){if(S.demo)return S.busy;const today=dayKey(new Date());
  if(S.src==='manual')return merge(S.manual);
  if(S.src==='ics')return S.ics?icsBusy(S.ics.ev,new Date()):[];
  if(SRV[S.src])return S.busyDate===today?S.busy:[];
  return []}
/* .ics: VEVENTs with DAILY/WEEKLY recurrence, EXDATE and moved instances */
function icsParse(text){const lines=text.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').split(/\r?\n/),ev=[];let cur=null;
  const pd=(v,p)=>{const m=v.match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?$/);if(!m)return null;if(!m[4])return{allDay:true};
    const a=[+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)];return{t:(m[7]?Date.UTC(...a):new Date(...a).getTime())}};
  for(const raw of lines){const i=raw.indexOf(':');if(i<0)continue;const head=raw.slice(0,i),val=raw.slice(i+1).trim(),name=head.split(';')[0].toUpperCase();
    if(raw.startsWith('BEGIN:VEVENT')){cur={ex:[]};continue}

const dayType=()=>S.demo?'home':(S.type||S.set.week[new Date().getDay()]);

      (inClaude?pick('google','Google Calendar','Syncs through your Claude connector',cal)+pick('outlook','Outlook','Microsoft 365 connector in Claude',cal):'')+
      pick('ics','Import a calendar file','.ics export from Google or Outlook, kept on this phone','<path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>')+
      pick('manual','Type in today\'s busy times','Quickest way to try Ritmo','<path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>')+extra+
      '<div class="foot"><button class="big" data-a="onbnext" '+(hasCalR()?'':'disabled')+'>Continue</button><button class="ghost" data-a="onbback">Back</button></div></div></div>'}
  return '<div class="onb"><div>'+dots+'<h2>Your rhythm</h2><p>Ritmo picks the gaps that matter most: before long runs of calls, not just the first free minute.</p><div class="card">'+within2(REAL,rhythm)+'</div>'+
    '<p class="priv">You get a heads-up 3 minutes before heating, with Hold, +5 min and Skip.</p><div class="foot"><button class="big" data-a="done">Plan my day</button><button class="ghost" data-a="onbback">Back</button></div></div></div>'}
const hasCalR=()=>REAL.src==='manual'?REAL.manual.length>0:REAL.src==='ics'?!!REAL.ics:!!(SRV[REAL.src]&&REAL.sync&&REAL.sync.at);
function within2(st,fn){let r;within(st,()=>{r=fn()});return r}

/* ================= demo ================= */
const STORY=[[8*H+50*M+30,'Heads-up, then brew',()=>{}],[10*H+20*M,'Client call runs over',()=>{S.over={from:10.5*H};log('Demo: the client call is running over.')}],
  [11*H+50*M,'New meeting lands',()=>{S.busy=merge(S.busy.concat({s:12*H+45*M,e:13*H}));replan('Demo: a 12:45 meeting was just added.')}],
  [12*H+15*M,'Forgot the next pod',()=>{S.m.pod=false;S.m.cup=false;log('Demo: no pod in the machine.')}]];
function startDemo(){const D=Object.assign(fresh(),{demo:true,onb:3,src:'sample',busy:SAMPLE.map(b=>({...b})),t:8*H+25*M,playing:false,speed:300,acc:0});
  D.set.max=3;S=D;plan();log('Demo: sample day loaded. Planned '+S.plan.filter(p=>p.on).map(p=>fmt(p.at)).join(', ')+'.');render()}
function demoBar(){if(!S.demo){$('demo').innerHTML='';return}const cur=inEvent(S.t);
  $('demo').innerHTML='<div class="demo"><div class="top"><output>'+fmt(S.t)+'</output><button class="go" data-a="play" style="min-height:40px;padding:0 14px;border-radius:12px;font-weight:600">'+(S.playing?'Pause':'Play')+'</button><button data-a="next" style="background:#ffffff14;min-height:40px;padding:0 12px;border-radius:12px;font-weight:600">Next</button></div>'+
   '<details><summary>Speed, script and problems</summary><div class="row" style="margin:6px 0">'+[[60,'1×'],[300,'5×'],[900,'15×']].map(([s,l])=>'<button data-a="spd" data-id="'+s+'" aria-pressed="'+(S.speed===s)+'">'+l+'</button>').join('')+'</div>'+
   '<div class="row" style="margin-bottom:6px">'+STORY.map((s,i)=>'<button data-a="story" data-id="'+i+'" '+(s[0]<=S.t?'disabled':'')+'>'+fmt(s[0])+' '+s[1]+'</button>').join('')+'</div>'+
   '<div class="row"><button data-a="over" '+(cur&&!S.over?'':'disabled')+'>Run call over</button><button data-a="endcall" '+(S.over?'':'disabled')+'>End call</button><button data-a="forget">Forget pod</button><button data-a="lowwater">Low water</button><button data-a="fullbin">Bin full</button><button data-a="restart">Restart</button><button data-a="exitdemo">Exit demo</button></div></details></div>'}
function nextMoment(){const c=[];for(const p of S.plan)if(p.on&&!p.adhoc){const bs=p.at-prep(p.drink);c.push(p.at-30*M,bs-3*M,bs,p.at,p.at+2*M)}for(const e of S.busy)c.push(e.s,e.e);
  return c.filter(x=>x>S.t+STEP).sort((a,b)=>a-b)[0]||S.set.end}

/* ================= render & actions ================= */
function syncBar(){const sb=$('sync');if(S.demo){sb.textContent='Demo';return}const s=REAL.sync||{};
  sb.textContent=SRV[REAL.src]?(s.busy?'Syncing…':s.err?'Sync issue':s.at?'Synced '+new Date(s.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):fmt(nowSec())):fmt(nowSec())}
function render(keepView){lastRender=Date.now();const open=document.querySelector('.demo details')?.open;
  if(!keepView){const y=scrollY;$('view').innerHTML=S.tab==='today'?today():S.tab==='machine'?machine():routine();if(Math.abs(scrollY-y)>2)scrollTo(0,y)}
  $('nav').innerHTML=[['today','Today'],['machine','Machine'],['routine','Routine']].map(([k,l])=>'<button data-a="tab" data-id="'+k+'" aria-current="'+(S.tab===k)+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[k]+'</svg>'+l+'</button>').join('');
  const o=onb();if($('onb')._h!==o){$('onb').innerHTML=o;$('onb')._h=o}demoBar();if(open){const d=document.querySelector('.demo details');if(d)d.open=true}syncBar()}
const find=k=>S.plan.find(p=>String(p.key)===String(k));
const setChange=()=>{S.plan.forEach(p=>{if(PEND.includes(p.status)){p.touched=false;p.userOn=null}});replan()};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const A={
  tab:id=>{S.tab=id;S.open=null;scrollTo(0,0)},
  onbnext:()=>{REAL.onb++},onbback:()=>{REAL.onb=Math.max(0,REAL.onb-1)},pick:()=>{REAL.onb=1},
  src:id=>{REAL.src=id;REAL.sync={};if(SRV[id])sync();within(REAL,()=>replan())},
  done:()=>{REAL.onb=3;REAL.t=nowSec();within(REAL,()=>{replan();step(REAL.t);log('Plan built: '+(S.plan.filter(p=>p.on&&PEND.includes(p.status)).map(p=>fmt(p.at)).join(', ')||'no gaps left today')+'.')})},
  sync:()=>sync(),syncbar:()=>{if(SRV[REAL.src]&&!S.demo)sync()},
  delb:id=>{REAL.manual=merge(REAL.manual).filter(b=>String(b.s)!==String(id));within(REAL,()=>replan('Busy time removed.'))},
  'max-':()=>{S.set.max=clamp(S.set.max-1,1,6);setChange()},'max+':()=>{S.set.max=clamp(S.set.max+1,1,6);setChange()},
  'cut-':()=>{S.set.cutoff=clamp(S.set.cutoff-30*M,S.set.start+H,21*H);setChange()},'cut+':()=>{S.set.cutoff=clamp(S.set.cutoff+30*M,S.set.start+H,21*H);setChange()},
  'start-':()=>{S.set.start=clamp(S.set.start-30*M,5*H,S.set.cutoff-H);setChange()},'start+':()=>{S.set.start=clamp(S.set.start+30*M,5*H,S.set.cutoff-H);setChange()},
  'walk-':()=>{S.set.walk=clamp(S.set.walk-1,1,10);setChange()},'walk+':()=>{S.set.walk=clamp(S.set.walk+1,1,10);setChange()},
  'space-':()=>{S.set.spacing=clamp(S.set.spacing-15,30,240);setChange()},'space+':()=>{S.set.spacing=clamp(S.set.spacing+15,30,240);setChange()},
  week:id=>{const o=['home','office','off'];S.set.week[+id]=o[(o.indexOf(S.set.week[+id])+1)%3];setChange()},
  daytype:()=>{const o=['home','office','off'];S.type=o[(o.indexOf(dayType())+1)%3];log('Today is now a '+TYPES[S.type].toLowerCase()+'.');setChange()},
  defd:id=>{S.set.drink=id;S.plan.forEach(p=>{if(PEND.includes(p.status))p.drink=id});setChange()},
  auto:()=>{S.set.auto=!S.set.auto;log(S.set.auto?'Automation on.':'Manual mode on. Nothing brews by itself.')},heads:()=>S.set.heads=!S.set.heads,
  notif:()=>{if(S.set.notif){S.set.notif=false;return}try{Notification.requestPermission().then(r=>{S.set.notif=r==='granted';if(!S.set.notif)notify('Notifications are blocked. Allow them for this site in your browser settings.');commit()})}catch(e){notify('This browser cannot show notifications.')}},
  pause:()=>{S.paused=!S.paused;log(S.paused?'Automation paused for today.':'Automation resumed.')},
  open:id=>{S.open=S.open===String(id)?null:String(id)},
  tog:id=>{const p=find(id);p.on=!p.on;p.touched=true;p.userOn=p.on;log((p.on?'Added a coffee at ':'Removed the coffee at ')+fmt(p.at)+'.');replan()},
  drink:v=>{const [k,d]=v.split('|'),p=find(k);p.drink=d;p.touched=true;p.userOn=p.on;replan()},
  shift:v=>{const [k,s]=v.split('|'),p=find(k);p.shift=(p.shift||0)+(+s);p.touched=true;p.userOn=p.on;p.hu=false;replan()},
  load:()=>{S.m.pod=true;S.m.cup=true;log('Pod and cup loaded.')},water:()=>{S.m.water=100;log('Water tank refilled.')},bin:()=>{S.m.bin=0;log('Capsule bin emptied.')},descale:()=>{S.m.descale=40;log('Descaling done.')},
  collect:id=>collect(find(id),S.t,false),hold:id=>hold(find(id),S.t,'You tapped Hold'),later:id=>delay(find(id)),
  release:id=>{const p=find(id);const pr=probs(p.drink);if(pr.length)notify('Cannot brew yet: '+pr[0]+'.');else brew(p,S.t)},
  skip:id=>skip(find(id)),
  brewd:id=>{S.brewD=id},
  brewnow:()=>{const d=S.brewD||S.set.drink;if(probs(d).length)return;const p={adhoc:true,key:'m'+(++S.seq),drink:d,at:S.t+prep(d),gs:S.t,ge:S.t+30*M,on:true,status:'planned',why:'One-tap brew'};
    S.plan.push(p);brew(p,S.t);notify(DR[d].n+' started. Ready at '+fmt(S.t+prep(d))+'.');replan()},
  copy:()=>{const k=S.k,txt='Ritmo '+S.date+': '+k.onTime+' ready on time, '+k.cold+' gone cold, '+k.held+' held for overruns, '+k.saved+' min saved.';try{navigator.clipboard.writeText(txt).then(()=>notify('Stats copied.'),()=>notify(txt))}catch(e){notify(txt)}},
  reset:()=>{S.confirmReset=true},resetno:()=>{S.confirmReset=false},
  resetyes:()=>{try{localStorage.removeItem(KEY)}catch(e){}REAL=fresh();S=REAL;$('ban').classList.remove('show');scrollTo(0,0)},
  play:()=>{S.playing=!S.playing},spd:id=>{S.speed=+id},next:()=>advance(nextMoment()),
  story:id=>{const s=STORY[id];advance(s[0]);s[2]();log('Demo script: '+s[1]+'.')},
  over:()=>{const e=inEvent(S.t);if(e){S.over={from:e.e};log('Demo: this call is running over.')}},endcall:()=>endCall(S.t,false),
  forget:()=>{if(S.m.pod&&!['heating','brewing','ready'].includes(S.m.state)){S.m.pod=false;S.m.cup=false;log('Demo: no pod in the machine.')}else{S.forget=true;log('Demo: you will forget the next pod.')}},
  lowwater:()=>{S.m.water=6;log('Demo: water tank is low.')},fullbin:()=>{S.m.bin=S.m.binMax;log('Demo: capsule bin is full.')},
  restart:()=>startDemo(),exitdemo:()=>{S=REAL;$('ban').classList.remove('show');advance(nowSec())}
};
document.addEventListener('click',e=>{const bb=e.target.closest('[data-ban]');if(bb){const f=$('ban')._acts[+bb.dataset.ban];$('ban').classList.remove('show');if(f)f[1]();return}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){f(b.dataset.id);commit()}});
document.addEventListener('submit',e=>{if(e.target.id!=='addb')return;e.preventDefault();
  const tm=v=>{const [h,m]=v.split(':').map(Number);return h*H+m*M},s=tm($('bs').value),en=tm($('be').value);
  if(!(en>s)){notify('The end time needs to be after the start time.');return}
  REAL.manual=merge(REAL.manual.concat({s,e:en}));within(REAL,()=>replan('Busy time added: '+fmt(s)+' – '+fmt(en)+'.'));
  const nx=Math.min(en+30*M,23*H);commit();const bi=$('bs'),be=$('be');if(bi){bi.value=fmt(en);be.value=fmt(nx)}});
document.addEventListener('change',e=>{if(e.target.id!=='icsf')return;const f=e.target.files&&e.target.files[0];if(!f)return;
  if(f.size>8e6){notify('That file is over 8 MB. Export just your main calendar.');return}
  f.text().then(txt=>{const ev=icsParse(txt);if(!ev.length){notify('No timed events found in that file.');return}
    REAL.ics={ev,n:ev.length,name:f.name.slice(0,60),at:Date.now()};REAL.src='ics';within(REAL,()=>replan('Imported '+ev.length+' events. Today has '+busyNow().length+' busy blocks.'));commit()},()=>notify('Could not read that file.'))});
let taps=[];$('logo').addEventListener('click',()=>{const n=Date.now();taps=taps.filter(x=>n-x<3000);taps.push(n);if(taps.length>=5){taps=[];if(S.demo)A.exitdemo();else startDemo();commit()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){realTick();if(SRV[REAL.src]&&REAL.onb>=3&&(!REAL.sync.at||Date.now()-REAL.sync.at>6e5))sync()}});
setInterval(()=>{if(S.demo){if(!S.playing)return;S.acc+=S.speed*.25;const n=Math.floor(S.acc/STEP)*STEP;if(n){S.acc-=n;if(S.t>=S.set.end+H){S.playing=false;render();return}advance(S.t+n);render(S.tab==='routine')}}else realTick()},250);
setInterval(()=>{if(!S.demo&&SRV[REAL.src]&&REAL.onb>=3&&!REAL.sync.busy)sync()},6e5);

rollDay();within(REAL,()=>{S.busy=busyNow();if(REAL.onb>=3){advance(nowSec());replan()}});render();
(async()=>{try{if(inClaude&&typeof claude.use==='function')mcp=await claude.use('mcp')}catch(e){mcp=null}if(SRV[REAL.src]&&REAL.onb>=1)sync();else render()})();
if(!inClaude&&'serviceWorker' in navigator&&location.protocol==='https:')try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
</body>
</html>
